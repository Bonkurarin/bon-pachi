<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BON UTOPIA｜夢も、希望も、大当たりも！</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; color: #3b2a00; font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; background: radial-gradient(ellipse at 50% 0, #4a3590, #150b2e 65%); }
  #app { max-width: 560px; height: 100dvh; margin: 0 auto; position: relative; }
  /* ===== 筐体 ===== */
  #cab { height: 100%; display: flex; flex-direction: column; background: linear-gradient(180deg, #fffefa, #f1e6c6 55%, #fffaf0); border-left: 4px solid #d9ab3c; border-right: 4px solid #d9ab3c; box-shadow: 0 0 0 1px #8a6410, 0 0 46px rgba(255,200,90,.45); position: relative; }
  /* ① 上部装飾 */
  #top { flex: none; position: relative; padding: 3px 8px 3px; background: linear-gradient(#ffffff, #f6e9bd); border-bottom: 3px solid #c9972b; box-shadow: 0 2px 8px rgba(0,0,0,.35); z-index: 2; }
  #lampRow { display: flex; justify-content: space-between; padding: 1px 4px 3px; }
  .lamp { width: 11px; height: 11px; border-radius: 50%; background: var(--c); box-shadow: 0 0 5px var(--c), inset 0 -2px 3px rgba(0,0,0,.3), inset 0 2px 2px rgba(255,255,255,.8); animation: lampA 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * .16s); }
  @keyframes lampA { 0%,100% { opacity: .4; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
  .cab-win .lamp { animation-duration: .4s; }
  #logoBox { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .sil { height: 40px; width: auto; filter: brightness(0) opacity(.22); pointer-events: none; }
  #logo { text-align: center; line-height: 1.05; }
  #logo h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: .14em; background: linear-gradient(90deg, #e03131, #f59f00, #f2c600, #37b24d, #1c7ed6, #7048e8, #d6336c); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 0 #b8860b); }
  #logo p { margin: 1px 0 0; font-size: 10px; font-weight: 800; letter-spacing: .08em; color: #8a6410; }
  .cab-win #logo h1 { animation: logoWin .9s linear infinite; }
  @keyframes logoWin { from { filter: hue-rotate(0deg) drop-shadow(0 0 8px #ffd43b); } to { filter: hue-rotate(360deg) drop-shadow(0 0 8px #ffd43b); } }
  /* ②③ 液晶＋遊技盤 */
  #boardWrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; background: linear-gradient(#0e1438, #070b22); box-shadow: inset 0 0 0 3px #c9972b, inset 0 0 18px rgba(0,0,0,.7); }
  #cv { display: block; border-radius: 16px 16px 0 0; }
  #lcdCv { position: absolute; border-radius: 10px; box-shadow: 0 0 0 3px #f6dc8a, 0 0 0 5px #9a6f12, 0 0 0 7px rgba(255,255,255,.55), 0 8px 16px rgba(0,0,0,.55); cursor: pointer; z-index: 2; }
  #fxCv { position: absolute; pointer-events: none; z-index: 3; border-radius: 16px 16px 0 0; }
  .cab-win #cv { box-shadow: 0 0 30px 6px rgba(255,214,90,.65); }
  #toast { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: rgba(40,28,0,.88); color: #ffe9a8; border: 1px solid #ffd86b; padding: 5px 14px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; z-index: 9; }
  #toast.show { opacity: 1; }
  /* ④⑤ 操作部分・下部パネル */
  #panel { flex: none; display: flex; gap: 8px; padding: 7px 9px calc(7px + env(safe-area-inset-bottom)); background: linear-gradient(#fffdf4, #ead9a6); border-top: 3px solid #c9972b; align-items: stretch; box-shadow: 0 -3px 10px rgba(0,0,0,.3); position: relative; z-index: 2; }
  #info { flex: 1; min-width: 0; display: grid; grid-template-columns: 1.15fr 1fr; gap: 4px 6px; align-content: start; }
  .disp { background: linear-gradient(#1b1546, #090620); border: 2px solid #c9972b; border-radius: 9px; padding: 2px 8px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; color: #cdbb86; font-size: 10px; box-shadow: inset 0 0 8px rgba(0,0,0,.8), 0 1px 0 #fff; }
  .disp b { font-size: 19px; color: #ffd86b; text-shadow: 0 0 8px rgba(255,190,40,.8); font-variant-numeric: tabular-nums; font-family: "Menlo", "Consolas", monospace; }
  .disp small { width: 100%; text-align: right; color: #9be5b2; font-size: 10px; font-variant-numeric: tabular-nums; margin-top: -3px; }
  #rateRow { grid-column: 1 / 3; display: flex; gap: 5px; align-items: center; }
  #rateRow .lb { font-size: 10px; font-weight: 800; color: #6b4b00; white-space: nowrap; }
  #mini { grid-column: 1 / 3; display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
  .mi { background: rgba(255,255,255,.7); border: 1px solid #d3b062; border-radius: 6px; text-align: center; font-size: 9px; color: #7a5a10; padding: 1px 0; line-height: 1.15; }
  .mi b { display: block; font-size: 13px; color: #2a1a00; font-variant-numeric: tabular-nums; }
  #btns { grid-column: 1 / 3; display: flex; gap: 5px; }
  button { flex: 1; min-height: 34px; padding: 5px 4px; border-radius: 10px; border: 1px solid #a87b12; background: linear-gradient(#fffbe8, #efcf72); color: #4a3200; font-size: 12px; font-weight: 800; box-shadow: 0 2px 0 #a87b12, inset 0 1px 0 #fff; touch-action: manipulation; }
  button:active { transform: translateY(1px); box-shadow: 0 1px 0 #a87b12; }
  button:disabled { opacity: .45; }
  button.on, button.sel { background: linear-gradient(#ffb74d, #ff8a00); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.3); }
  button.lend { background: linear-gradient(#ffe3f0, #ff9ac1); border-color: #b8336a; box-shadow: 0 2px 0 #b8336a, inset 0 1px 0 #fff; color: #5a0030; }
  #cfg { grid-column: 1 / 3; font-size: 11px; color: #6b4b00; }
  #cfg summary { cursor: pointer; font-weight: 800; padding: 1px 0; }
  #opts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 3px; }
  #opts button { flex: none; min-height: 28px; padding: 3px 10px; }
  .vl { display: flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 800; flex: 1 1 80px; min-width: 0; }
  #vol, #vol2 { flex: 1; min-width: 0; width: 100%; accent-color: #ff8a00; }
  #prob { background: #fffbe8; color: #4a3200; border: 1px solid #a87b12; border-radius: 8px; padding: 4px; font-size: 12px; }
  #handleBox { flex: none; width: 124px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #dial { position: relative; width: 108px; height: 108px; border-radius: 50%; border: 6px solid transparent; background: radial-gradient(circle at 35% 28%, #ffffff, #f4e6b4 42%, #c08d22 100%) padding-box, conic-gradient(#ff4d4d, #ff9f1c, #ffe14d, #3ddc84, #3a8dff, #7a5cff, #d05cff, #ff4d4d) border-box; box-shadow: 0 5px 10px rgba(0,0,0,.45); touch-action: none; cursor: grab; }
  #dial.active { filter: drop-shadow(0 0 10px #ff5a5a); }
  #knob { position: absolute; inset: 0; transform: rotate(60deg); pointer-events: none; }
  #knob i { position: absolute; left: 50%; top: 5px; width: 10px; height: 36px; margin-left: -5px; border-radius: 5px; background: linear-gradient(#ff5d7d, #b0002a); box-shadow: 0 0 0 2px #fff inset; }
  #dial::after { content: ""; position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #b9b9c6); box-shadow: 0 1px 3px rgba(0,0,0,.4); pointer-events: none; }
  #pw { font-size: 11px; font-weight: 800; color: #7a4b00; margin-top: 6px; }
  #hint { font-size: 9px; color: #8a6a30; }
  #sideRow { display: flex; gap: 4px; width: 100%; margin-top: 3px; }
  #sideRow button { min-height: 26px; padding: 2px 0; font-size: 11px; border-radius: 8px; }
  #sideRow button.sel { background: linear-gradient(#7fd0ff, #2f8ae0); border-color: #1b5fa8; box-shadow: 0 2px 0 #1b5fa8; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
  #sideRow button#bR.sel { background: linear-gradient(#ffd45a, #ff9a00); border-color: #b86a00; box-shadow: 0 2px 0 #b86a00; }
  #pw.rt { color: #c76a00; } #pw.lt { color: #1b5fa8; }
  /* ===== オーバーレイ ===== */
  .ov { position: fixed; inset: 0; z-index: 50; background: rgba(15,6,40,.88); display: none; align-items: center; justify-content: center; padding: 16px; }
  .ov.show { display: flex; }
  .box { width: min(92vw, 420px); max-height: 94dvh; overflow: auto; text-align: center; background: linear-gradient(#fffefa, #f3e5b8); color: #3b2a00; border: 3px solid #d9ab3c; border-radius: 18px; padding: 16px 14px; box-shadow: 0 0 0 2px #8a6410, 0 0 36px rgba(255,200,80,.55); }
  .box h2 { margin: 0; font-size: 30px; letter-spacing: .12em; font-weight: 900; background: linear-gradient(90deg, #e03131, #f59f00, #f2c600, #37b24d, #1c7ed6, #7048e8, #d6336c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .box .cc { margin: 2px 0 10px; color: #9a5a00; font-weight: 800; font-size: 14px; }
  #tStage { height: min(32dvh, 270px); display: flex; align-items: flex-end; justify-content: center; margin: -2px 0 4px; }
  #tImg { max-height: 100%; max-width: 70%; object-fit: contain; cursor: pointer; filter: drop-shadow(0 3px 5px rgba(120,80,0,.35)); transition: opacity .35s, transform .35s; }
  #tImg.out { opacity: 0; transform: translateY(6px) scale(.97); }
  #tDots { display: flex; justify-content: center; gap: 9px; margin: 2px 0 8px; }
  #tDots i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid #b8891c; cursor: pointer; opacity: .55; transition: transform .2s, opacity .2s; }
  #tDots i.on { opacity: 1; transform: scale(1.35); box-shadow: 0 0 6px rgba(255,190,60,.9); }
  .bons { display: flex; justify-content: center; margin: 2px 0 6px; }
  .bons img { width: 11.5vw; max-width: 44px; margin: 0 -1px; animation: hop 1.6s ease-in-out infinite; }
  @keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .coinbar { background: rgba(0,0,0,.06); border: 1px solid #d3b062; border-radius: 12px; padding: 8px; margin: 8px 0; font-size: 13px; }
  .coinbar b { color: #b36b00; font-size: 18px; }
  .big { display: block; width: 100%; margin: 8px 0 0; padding: 11px 8px; font-size: 15px; border-radius: 14px; min-height: 52px; }
  .big small { display: block; font-weight: 600; font-size: 11px; color: #6b4b00; margin-top: 2px; }
  .big.go { background: linear-gradient(#ffb74d, #ff8a00); color: #fff; border-color: #b35f00; box-shadow: 0 2px 0 #b35f00; }
  .big.go small { color: #fff3dd; }
  .rec { margin-top: 10px; font-size: 11px; color: #7a5a10; line-height: 1.6; }
  .free { font-size: 10px; color: #2e7d4b; margin-top: 8px; font-weight: 700; }
</style>
</head>
<body>
<div id="app">
  <div id="menu" class="ov show"><div class="box">
    <div id="tStage"><img id="tImg" alt=""></div><div id="tDots"></div>
    <h2>BON UTOPIA</h2>
    <div class="cc">夢も、希望も、大当たりも！</div>
    <div class="coinbar">🪙 ボンコイン <b id="mCoin">0</b> / 5<br><span id="mNext"></span></div>
    <div id="menuBtns"></div>
    <div class="rec" id="menuRec"></div>
    <div class="free">完全無料・課金なし・換金なし。ボンコインは1時間に1枚、自動で回復するよ。</div>
  </div></div>
  <div id="empty" class="ov"><div class="box">
    <h2 style="font-size:22px">玉がなくなったよ</h2>
    <div class="coinbar">🪙 ボンコイン <b id="eCoin">0</b> / 5<br><span id="eNext"></span></div>
    <button class="big go" id="eRefill">ボンコインを使って玉を補充する</button>
    <button class="big" id="eQuit">遊技を終了する</button>
  </div></div>

  <div id="cab">
    <!-- ① 上部装飾 -->
    <div id="top">
      <div id="lampRow"></div>
      <div id="logoBox">
        <img class="sil" id="silL1" alt=""><img class="sil" id="silL2" alt="">
        <div id="logo"><h1>BON UTOPIA</h1><p>夢も、希望も、大当たりも！</p></div>
        <img class="sil" id="silR1" alt=""><img class="sil" id="silR2" alt="">
      </div>
    </div>
    <!-- ② 液晶（独立したcanvas） ③ 遊技盤 -->
    <div id="boardWrap">
      <canvas id="cv"></canvas>
      <canvas id="lcdCv" aria-label="液晶画面（タップで演出スキップ）"></canvas>
      <canvas id="fxCv"></canvas>
      <div id="toast"></div>
    </div>
    <!-- ④ 操作部分 ⑤ 下部パネル -->
    <div id="panel">
      <div id="info">
        <div class="disp"><span>持ち玉</span><b id="hHave">0</b></div>
        <div class="disp"><span>🪙 ボンコイン</span><b id="hCoin">0/5</b><small>次の回復 <span id="hNext">--:--</span></small></div>
        <div id="rateRow">
          <span class="lb">貸玉 <span id="hRate">4円</span></span>
          <button id="r4">4円</button><button id="r1">1円</button>
          <button id="bLend" class="lend">貸玉 🪙</button>
        </div>
        <div id="mini">
          <div class="mi">保留<b id="sHold">0</b></div>
          <div class="mi">回転<b id="sSpin">0</b></div>
          <div class="mi">入賞<b id="sHit">0</b></div>
          <div class="mi"><span id="dbgTap" style="white-space:nowrap;letter-spacing:-.5px">大当たり</span><b id="sWin">0</b></div>
          <div class="mi">打球<b id="sShot">0</b></div>
          <div class="mi">アウト<b id="sOut">0</b></div>
        </div>
        <div id="btns">
          <button id="bAuto">連続発射 OFF</button>
          <button id="bSkip">演出スキップ</button>
          <button id="bQuit">メニュー</button>
        </div>
        <details id="cfg"><summary>設定（音・確率）</summary>
          <div id="opts">
            <button id="bSnd">音 ON</button>
            <label class="vl">SE<input type="range" id="vol" min="0" max="100" value="60" aria-label="効果音の音量"></label>
            <label class="vl">BGM<input type="range" id="vol2" min="0" max="100" value="50" aria-label="BGMの音量"></label>
            <select id="prob" aria-label="大当たり確率">
              <option value="10">1/10(テスト)</option>
              <option value="99">1/99</option>
              <option value="199">1/199</option>
              <option value="319" selected>1/319</option>
              <option value="399">1/399</option>
            </select>
          </div>
        </details>
      </div>
      <div id="handleBox">
        <div id="dial"><div id="knob"><i></i></div></div>
        <div id="pw">強さ 72%</div>
        <div id="sideRow"><button id="bL">左打ち</button><button id="bR">右打ち</button></div>
        <div id="hint">回して調節 / 押し続けて発射</div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ORIGINAL PACHINKO SIMULATOR  第1段階
   外部ライブラリなし（物理演算は自前実装）
   ============================================================ */
(() => {
'use strict';

/* ---------- 設定値（ここを触ればバランス調整できる） ---------- */
const CONFIG = {
  W: 480, H: 720,          // 盤面の論理サイズ
  gravity: 1400,           // 重力 px/s^2
  ballR: 5,                // 玉の半径
  nailR: 2.6,              // 釘の半径
  nailRestitution: 0.45,   // 釘の反発
  wallRestitution: 0.35,   // 壁の反発
  ballRestitution: 0.55,   // 玉同士の反発
  nailJitter: 0.35,        // 釘衝突時のランダム度合い
  maxSpeed: 2200,
  fireInterval: 0.35,      // 発射間隔(秒)
  powerMin: 700, powerMax: 1800, // 発射速度(px/s)
  maxBallsOnBoard: 100,
  subSteps: 8,
};
const { W, H } = CONFIG;
const R = CONFIG.ballR;

/* ---------- 盤面ジオメトリ ---------- */
const FRAME = 14;             // 外枠の厚み
const RC = 150;               // 上部コーナーの丸み
const RAIL_X = 58;            // 発射レーンの内レール（下端のx）
const RAIL_TOP = 300;         // 内レール上端
const RAIL_X1 = 66;           // 内レール上端のx（レーンはわずかに右へ傾く）
const LANE_S = 0.06;          // 発射時の右向き成分（レーンの傾き）
const LCD = { x: 120, y: 64, w: 240, h: 190 };      // 液晶の描画用の仮想座標（専用canvasへ拡大して表示）
const LCDP = { x: 100, y: 56, w: 280, h: 222 };       // 盤面上で液晶が占める物理範囲（玉は当たる）
const YAKU = { x: 240, y: 338, r: 24 };               // 中央役物
const CHUCKER = { x: 218, y: 652, w: 44, h: 16 };
/* 右打ち用：液晶の右側の右ルート（仕切りレール）と右アタッカー */
const CH = { x: 394, y0: 290, y1: 552 };               // 右ルートの仕切りレール
const STG = { x0: 64, y0: 334, x1: 190, y1: 410 };     // 左打ちの玉を中央へ導くステージレール
const WM = [{ x: 118, y: 500, a: 0 }, { x: 330, y: 452, a: 1 }]; // 風車
const WM_R = 17;

/* ---------- 釘の配置 ---------- */
const nails = [];
function segDist(x, y, a, b, c, d) { const dx = c - a, dy = d - b; let t = ((x - a) * dx + (y - b) * dy) / (dx * dx + dy * dy); t = Math.max(0, Math.min(1, t)); return Math.hypot(x - (a + dx * t), y - (b + dy * t)); }
function wmNear(x, y) { return WM.some(w => Math.hypot(x - w.x, y - w.y) < WM_R + 14); }
(function buildNails() {
  const sp = 34;
  for (let row = 0, y = 100; y <= 560; row++, y += sp) {
    const off = row % 2 ? sp / 2 : 0;
    for (let x = 84 + off; x <= W - 30; x += sp) {
      if (x > W - FRAME - 14) continue;
      if (x > LCDP.x - 4 && x < LCDP.x + LCDP.w + 4 && y > LCDP.y - 16 && y < LCDP.y + LCDP.h + 16) continue;
      if (Math.hypot(x - YAKU.x, y - YAKU.y) < YAKU.r + 18) continue;
      if (x > CH.x - 8 && y > CH.y0 - 20 && y < CH.y1 + 30) continue;   // 右ルートは別に配置
      if (wmNear(x, y)) continue;
      if (segDist(x, y, STG.x0, STG.y0, STG.x1, STG.y1) < 13 || Math.hypot(x - STG.x1, y - STG.y1) < 26) continue;
      nails.push({ x, y });
    }
  }
  // 液晶脇の導き釘
  for (let y = 110; y < LCDP.y + LCDP.h; y += 38) nails.push({ x: 408, y });
  // 右ルートの玉をはねさせる釘
  [[430, 340], [452, 384], [430, 428], [452, 472], [430, 516]].forEach(([x, y]) => nails.push({ x, y }));
  // チャッカーへ導くV字の釘
  for (let i = 0; i <= 4; i++) {
    const t = i / 4;
    nails.push({ x: 126 + (CHUCKER.x - 8 - 126) * t, y: 580 + (648 - 580) * t });
    nails.push({ x: 354 + (CHUCKER.x + CHUCKER.w + 8 - 354) * t, y: 580 + (648 - 580) * t });
  }
  // チャッカー脇のガイド釘
  nails.push({ x: CHUCKER.x - 8, y: 668 }, { x: CHUCKER.x + CHUCKER.w + 8, y: 668 });
})();

/* ---------- 状態 ---------- */
let balls = [];
const newState = () => ({ have: 0, shot: 0, hit: 0, out: 0, queue: [], spins: 0, wins: 0, plays: 0, maxHave: 0 });

function drawLottery() {

  let symIdx = null;

  noReachWin: 0.08,         // 当たりでもリーチなしで揃う割合

function wpick(keys, wf) {
  const tot = keys.reduce((a, k) => a + wf(k), 0); if (tot <= 0) return keys[0];
  let r = Math.random() * tot; for (const k of keys) { if ((r -= wf(k)) < 0) return k; } return keys[keys.length - 1];
}
function planDirection(res) {
  const win = res.win, rnd = Math.random, n = SYM_DEFS.length;
  const P = { win, yokoku: [], reach: null, premium: false, tier: 0, stops: [1.6, 2.6, 3.6], R: 99, M: 3.6, sym: null, chars: [], bg: Math.floor(rnd() * 3), pat: Math.floor(rnd() * 3) };
  P.premium = win && rnd() < DIR_CFG.premiumRate;
  const rk = Object.keys(REACHES);
  if (P.premium) P.reach = 'niji';
  else if (win) P.reach = rnd() < DIR_CFG.noReachWin ? null : wpick(rk, k => REACHES[k].winW);
  else P.reach = rnd() < DIR_CFG.reachRateLose ? wpick(rk, k => REACHES[k].loseW) : null;
  // 図柄の見た目（当落は不変）
  if (win) P.sym = [res.symIdx, res.symIdx, res.symIdx];
  else {
    const ri = () => Math.floor(rnd() * n);
    if (!P.reach) { let a, b, c; do { a = ri(); b = ri(); c = ri(); } while (a === c || (a === b && b === c)); P.sym = [a, b, c]; }
    else { const a = ri(); let b; do { b = ri(); } while (b === a); P.sym = [a, b, a]; }
  }
  P.chars = [0, 1, 2, 3, 4, 5, 6].sort(() => rnd() - 0.5);
  if (res.win && res.symIdx >= 7 && res.symIdx <= 13) P.chars[0] = res.symIdx - 7;
  // 停止タイミング（図柄ごとに別々）
  if (P.reach) { const L = 2.0 + rnd() * 0.4, R = L + 0.9; P.R = R; P.M = R + REACHES[P.reach].dur; P.stops = [L, P.M, R]; }
  else { const a = 1.5 + rnd() * 0.3; P.stops = [a, a + 1.0 + rnd() * 0.3, a + 2.0 + rnd() * 0.4]; P.M = P.stops[2]; }
  // 予告
  const cnt = wpick(['0', '1', '2'], k => DIR_CFG.yokokuCount[win ? 'win' : 'lose'][+k]);
  const yk = Object.keys(YOKOKU), used = {};

let angleDeg = 0;            // ハンドル角度 (-135〜135)
let firing = false, autoFire = false, fireTimer = 0;

/* ---------- 物理 ---------- */
function powerOf() { return (angleDeg + 135) / 270; }
function speedOf() { return CONFIG.powerMin + powerOf() * (CONFIG.powerMax - CONFIG.powerMin); }

function fireBall() {
  if (!playing || (state.have <= 0 && !inBonus() && !debugMode)) return false;
  if (balls.length >= CONFIG.maxBallsOnBoard) return false;
  const v = speedOf() * (1 + (Math.random() - 0.5) * 0.03);
  balls.push({ x: 20 + Math.random() * 3, y: H - 30, vx: v * LANE_S + (Math.random() - 0.5) * 12, vy: -v, slow: 0 });
  if (!inBonus() && !debugMode) state.have--;
  state.shot++; dm('shot');
  sfxFire();
  return true;
}

function hitCircle(b, cx, cy, cr, e, jitter, isNail) {
  const dx = b.x - cx, dy = b.y - cy, minD = R + cr;
  const d2 = dx * dx + dy * dy;
  if (d2 >= minD * minD) return false;
  const d = Math.sqrt(d2) || 0.0001;
  const nx = dx / d, ny = dy / d;
  b.x = cx + nx * minD; b.y = cy + ny * minD;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) {
    if (isNail && -vn > 140) sfxNail(-vn);
    b.vx -= (1 + e) * vn * nx;
    b.vy -= (1 + e) * vn * ny;
    if (jitter) {
      const j = (Math.random() - 0.5) * jitter * -vn;
      b.vx += -ny * j; b.vy += nx * j;
    }
  }
  return true;
}

function hitWallNormal(b, nx, ny) { // nx,ny: 内向き法線
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) {
    const e = CONFIG.wallRestitution;
    b.vx -= (1 + e) * vn * nx;
    b.vy -= (1 + e) * vn * ny;
  }
}

function collideWalls(b) {
  const L = FRAME + R, Rt = W - FRAME - R;
  // 上部コーナーの円弧
  const lcx = FRAME + RC, rcx = W - FRAME - RC, cy = FRAME + RC;
  if (b.x < lcx && b.y < cy) {
    const dx = b.x - lcx, dy = b.y - cy, d = Math.hypot(dx, dy) || 0.0001;
    if (d > RC - R) {
      const nx = -dx / d, ny = -dy / d;
      b.x = lcx + (dx / d) * (RC - R); b.y = cy + (dy / d) * (RC - R);
      hitWallNormal(b, nx, ny);
    }
  } else if (b.x > rcx && b.y < cy) {
    const dx = b.x - rcx, dy = b.y - cy, d = Math.hypot(dx, dy) || 0.0001;
    if (d > RC - R) {
      const nx = -dx / d, ny = -dy / d;
      b.x = rcx + (dx / d) * (RC - R); b.y = cy + (dy / d) * (RC - R);
      hitWallNormal(b, nx, ny);
    }
  } else {
    if (b.y < FRAME + R) { b.y = FRAME + R; hitWallNormal(b, 0, 1); }
  }
  if (b.x < L) { b.x = L; hitWallNormal(b, 1, 0); }
  if (b.x > Rt) { b.x = Rt; hitWallNormal(b, -1, 0); }
}

function collideRail(b) {
  // 内レール：縦線分 (RAIL_X, RAIL_TOP)-(RAIL_X, H) 半径2のカプセル
  hitSeg(b, RAIL_X, H, RAIL_X1, RAIL_TOP, 2.2, 0.35, 0.1);
}
function hitSeg(b, ax, ay, bx, by, rad, e, jitter) {
  const dx = bx - ax, dy = by - ay; let t = ((b.x - ax) * dx + (b.y - ay) * dy) / (dx * dx + dy * dy); t = t < 0 ? 0 : t > 1 ? 1 : t;
  return hitCircle(b, ax + dx * t, ay + dy * t, rad, e, jitter);
}
const attOpen = () => bonus.open && lcd.phase === 'rounds';
function collideRoute(b) {
  if (!denOpen()) hitSeg(b, DEN.x - 5, DEN.y - 4, DEN.x + DEN.w + 5, DEN.y + 2, 2.2, 0.35, 0.1); // 閉じている間のフタ
  hitSeg(b, STG.x0, STG.y0, STG.x1, STG.y1, 2.4, 0.25, 0.05);
  hitSeg(b, CH.x, CH.y0, CH.x, CH.y1, 2.6, 0.4, 0.1);
  if (!attOpen()) hitSeg(b, ATT.x + ATT.w + 4, ATT.y - 2, ATT.x - 8, ATT.y + 16, 2.2, 0.35, 0.1); // 閉じているときは斜めのフタ
}
function collideWM(b) {
  for (const w of WM) {
    if (Math.abs(b.x - w.x) > WM_R + 10 || Math.abs(b.y - w.y) > WM_R + 10) continue;
    hitCircle(b, w.x, w.y, 3, 0.4, 0.1);
    for (let k = 0; k < 4; k++) {
      const a = w.a + k * Math.PI / 2, ca = Math.cos(a), sa = Math.sin(a);
      for (const d of [8, 14]) hitCircle(b, w.x + ca * d, w.y + sa * d, 2.4, 0.45, 0.12);
    }
  }
}

function collideYaku(b) { hitCircle(b, YAKU.x, YAKU.y, YAKU.r, 0.55, 0.2); }
function collideLCD(b) {
  const px = Math.min(Math.max(b.x, LCDP.x), LCDP.x + LCDP.w);
  const py = Math.min(Math.max(b.y, LCDP.y), LCDP.y + LCDP.h);
  if (b.x < LCDP.x + 2 && b.y > LCDP.y) hitCircle(b, px, py, 0, 0.04, 0); else hitCircle(b, px, py, 0, 0.4, 0.2);  // 左脇は玉が素直に落ちる
}

function collideBalls() {
  const n = balls.length, minD = R * 2, e = CONFIG.ballRestitution;
  for (let i = 0; i < n; i++) {
    const a = balls[i];
    for (let j = i + 1; j < n; j++) {
      const c = balls[j];
      const dx = c.x - a.x; if (dx > minD || dx < -minD) continue;
      const dy = c.y - a.y; if (dy > minD || dy < -minD) continue;
      const d2 = dx * dx + dy * dy;
      if (d2 >= minD * minD) continue;
      const d = Math.sqrt(d2) || 0.0001;
      const nx = dx / d, ny = dy / d, ov = (minD - d) / 2;
      a.x -= nx * ov; a.y -= ny * ov; c.x += nx * ov; c.y += ny * ov;
      const rvn = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
      if (rvn < 0) {
        const imp = -(1 + e) * rvn / 2;
        a.vx -= imp * nx; a.vy -= imp * ny; c.vx += imp * nx; c.vy += imp * ny;
      }
    }
  }
}

function step(h) {
  const g = CONFIG.gravity; denT += h;
  WM[0].a += 1.5 * h; WM[1].a -= 1.8 * h;
  for (const b of balls) {
    b.vy += g * h;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > CONFIG.maxSpeed) { b.vx *= CONFIG.maxSpeed / sp; b.vy *= CONFIG.maxSpeed / sp; }
    b.x += b.vx * h; b.y += b.vy * h;
    collideWalls(b);
    collideRail(b);
    collideRoute(b);
    collideWM(b);
    collideLCD(b);
    collideYaku(b);
    for (let i = 0; i < nails.length; i++) {
      const n = nails[i];
      if (Math.abs(b.x - n.x) > 10 || Math.abs(b.y - n.y) > 10) continue;
      hitCircle(b, n.x, n.y, CONFIG.nailR, CONFIG.nailRestitution, CONFIG.nailJitter, true);
    }
  }
  collideBalls();
}

function postStep(dt) {
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    // STARTチャッカー入賞
    if (b.x > CHUCKER.x && b.x < CHUCKER.x + CHUCKER.w && b.y > CHUCKER.y && b.y < CHUCKER.y + CHUCKER.h) {
      state.hit++; dm('hit'); state.have += PRIZE.hes; flash = 1; onStart(); balls.splice(i, 1); continue;
    }
    // 電チュー（右ヘソ）：確変・時短中だけ開く
    if (denOpen() && b.x > DEN.x && b.x < DEN.x + DEN.w && b.y > DEN.y && b.y < DEN.y + DEN.h) {
      state.hit++; dm('hit'); dm('den'); G.rec.den++; dexMark('sp', 'den'); state.have += PRIZE.den; flash = 0.6; onStart(); balls.splice(i, 1); continue;
    }
    // アタッカー（大当たり中のみ）
    if (attOpen() && b.y > ATT.y && b.y < ATT.y + ATT.h && b.x > ATT.x && b.x < ATT.x + ATT.w) { catchBall(); balls.splice(i, 1); continue; }
    // 盤面の外
    if (b.y > H + 12) { state.out++; balls.splice(i, 1); continue; }
    // 引っかかり対策
    if (Math.hypot(b.vx, b.vy) < 8) {
      b.slow += dt;
      if (b.slow > 0.6) { b.vx += (Math.random() - 0.5) * 120; b.vy -= 40; }
      if (b.slow > 4) { state.out++; balls.splice(i, 1); }
    } else b.slow = 0;
  }
}

  tickCoins();
  $('hCoin').textContent = save.coins + '/' + COIN.max;
  $('hNext').textContent = fmtLeft();
  $('hRate').textContent = save.rate + '円';
  $('hHave').textContent = debugMode ? '∞' : state.have;
  const locked = hasSession();
  $('r4').classList.toggle('sel', save.rate === 4); $('r1').classList.toggle('sel', save.rate === 1);
  $('r4').disabled = $('r1').disabled = locked;
  $('bLend').disabled = !playing || save.coins <= 0;
  if (state.have > state.maxHave) state.maxHave = state.have;
  if ($('menu').classList.contains('show')) { $('mCoin').textContent = save.coins; $('mNext').textContent = nextText(); const need = !hasSession(); if (need && $('menuBtns').querySelector('[data-rate]') && $('menuBtns').querySelector('[data-rate]').disabled !== (save.coins <= 0)) renderMenu(); }
  const em = $('empty');
  if (playing && !debugMode && state.have <= 0 && balls.length === 0 && lcd.phase === 'idle' && state.queue.length === 0) {
    if (!em.classList.contains('show')) em.classList.add('show');
    $('eCoin').textContent = save.coins; $('eNext').textContent = nextText();
    $('eRefill').disabled = save.coins <= 0;
    $('eRefill').textContent = save.coins > 0 ? `ボンコインを使って玉を補充する（+${RATES[save.rate].lend}玉）` : 'ボンコインがありません';
  }
}
$('eRefill').addEventListener('click', () => { if (!useCoin()) return; state.have += RATES[save.rate].lend; $('empty').classList.remove('show'); saveGame(); toast(`玉を ${RATES[save.rate].lend} 個補充したよ`); });
$('eQuit').addEventListener('click', showMenu);
$('r4').addEventListener('click', () => { if (!hasSession()) { save.rate = 4; saveGame(); } });
$('r1').addEventListener('click', () => { if (!hasSession()) { save.rate = 1; saveGame(); } });
$('bLend').addEventListener('click', () => { if (!playing) return; if (!useCoin()) { toast('ボンコインがないよ'); return; } state.have += RATES[save.rate].lend; saveGame(); sfxChucker(); toast(`貸玉 ${RATES[save.rate].lend}玉！（${save.rate}円）`); });

const TITLE_ORDER = ["red", "blue", "yellow", "green", "purple", "pink", "rainbow"], TITLE_COL = ["#e03131", "#1c7ed6", "#f2c600", "#37b24d", "#7048e8", "#f06595", "#fff"];
let tIdx = Math.floor(Math.random() * 7), tTimer = 0;
function tShow(i, fade) {
  tIdx = (i + 7) % 7; const im = $('tImg');
  const set = () => { im.src = TITLE_ART[TITLE_ORDER[tIdx]]; im.classList.remove('out'); [...$('tDots').children].forEach((d, k) => d.classList.toggle('on', k === tIdx)); };
  if (fade) { im.classList.add('out'); setTimeout(set, 330); } else set();
}
$('tDots').innerHTML = TITLE_COL.map((c, i) => `<i style="background:${c}" data-i="${i}"></i>`).join('');
$('tDots').addEventListener('click', e => { const d = e.target.closest('i'); if (d) { tShow(+d.dataset.i, true); tRestart(); } });
$('tImg').addEventListener('click', () => { tShow(tIdx + 1, true); tRestart(); });
function tRestart() { clearInterval(tTimer); tTimer = setInterval(() => { if ($('menu').classList.contains('show')) tShow(tIdx + 1, true); }, 3800); }
tShow(tIdx, false); tRestart();

setInterval(() => { if (playing) saveGame(); }, 3000);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
window.addEventListener('pagehide', saveGame);

/* ---------- 毎日ログインボーナス ---------- */
function loginCheck() {
  const t = todayKey(); if (G.login.last === t) return null;
  const y = todayKey(new Date(Date.now() - 864e5));
  G.login.streak = G.login.last === y ? G.login.streak + 1 : 1; G.login.last = t; G.login.total++;
  const reward = G.login.streak % 7 === 0 ? 2 : 1; save.coins += reward; saveGame();
  return { streak: G.login.streak, reward };
}
function showLogin(r) {
  const day = ((r.streak - 1) % 7) + 1; let dots = '';
  for (let i = 1; i <= 7; i++) dots += `<i class="ld ${i <= day ? 'on' : ''}">${i === 7 ? '★' : i}</i>`;
  openSub(`<h2 style="font-size:22px">ログインボーナス</h2><div class="cc" style="text-align:center">連続 ${r.streak} 日目！</div><div class="ldrow">${dots}</div>
  <div style="text-align:center;font-weight:900;font-size:22px;margin:12px 0 4px">🪙 ボンコイン +${r.reward}</div>
  <div style="text-align:center;font-size:11px;color:#8a6a30">7日目はボーナスが2枚になるよ</div><button class="big go" data-close="1">やったー！</button>`);
}

  if (S.count >= QUIZ_PER_DAY) {
    openSub(`<h2 style="font-size:22px">🧠 ボンクイズ</h2><p style="text-align:center;font-weight:800;margin:12px 0">きょうの3問は おしまい！<br>（正解 ${S.ok} / ${S.count}）<br>また明日、挑戦してね。</p>${closeBtn}`);
    return;
  }
  let pool = QUIZ.map((_, i) => i).filter(i => !S.asked.includes(i)); if (!pool.length) pool = QUIZ.map((_, i) => i);
  const idx = pool[Math.floor(Math.random() * pool.length)], q = QUIZ[idx];
  const order = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
  quizCur = { idx, order, done: false };
  let h = `<h2 style="font-size:22px">🧠 ボンクイズ</h2><div style="text-align:center;font-size:11px;color:#8a6a30">きょう ${S.count + 1} 問目 / ${QUIZ_PER_DAY}問　正解で🪙1枚</div>
    <p style="font-weight:900;font-size:16px;margin:10px 0 4px;line-height:1.5">${esc(q.q)}</p>`;
  order.forEach((o, k) => { h += `<button class="qchoice" data-k="${k}">${'ABCD'[k]}　${esc(q.a[o])}</button>`; });
  openSub(h + '<button class="big" data-close="1" style="margin-top:12px">あとでやる</button>');
  document.querySelectorAll('#subBox .qchoice').forEach(b => b.onclick = () => answerQuiz(+b.dataset.k));
}
function answerQuiz(k) {
  if (!quizCur || quizCur.done) return; quizCur.done = true;
  const S = quizState(), q = QUIZ[quizCur.idx], right = quizCur.order[k] === 0;
  S.count++; S.asked.push(quizCur.idx); G.rec.quizAll++;
  if (right) { S.ok++; G.rec.quizOk++; save.coins += 1; }
  saveGame();
  document.querySelectorAll('#subBox .qchoice').forEach((b, i) => { b.disabled = true; if (quizCur.order[i] === 0) b.classList.add('ok'); else if (i === k) b.classList.add('ng'); });
  const left = quizLeft();
  const res = document.createElement('div');
  res.innerHTML = `<div style="text-align:center;font-weight:900;font-size:20px;margin:12px 0 2px;color:${right ? '#1d8a3f' : '#c0392b'}">${right ? '⭕ 正解！ 🪙+1' : '❌ ざんねん……'}</div>
    <div style="background:#fffbe8;border:2px solid #e0b84a;border-radius:10px;padding:7px 9px;font-size:12px;font-weight:700;line-height:1.6">${esc(q.n)}</div>
    <button class="big go" id="qNext">${left > 0 ? `つぎの問題へ（あと${left}問）` : '今日はおしまい'}</button>${closeBtn}`;
  document.getElementById('subBox').appendChild(res); bindClose();
  document.getElementById('qNext').onclick = () => left > 0 ? openQuiz() : closeSub();
  document.getElementById('subBox').scrollTop = 99999;
}

/* ---------- 図鑑 ---------- */
const SP_DEX = { win: '大当たり', premium: 'プレミアム大当たり', seven: '7揃い大当たり', kaku: '確変突入', jitan: '時短突入', den: '電チュー入賞' };
let dexTab = 'bon';
function openDex(tab) {
  if (tab) dexTab = tab;
  const tabs = [['bon', 'ボン'], ['sym', '図柄'], ['fx', '演出'], ['rec', '記録']];
  let h = `<h2 style="font-size:22px">📖 図鑑</h2><div class="tabs">${tabs.map(([k, n]) => `<button data-t="${k}" class="${k === dexTab ? 'on' : ''}">${n}</button>`).join('')}</div>`;
  if (dexTab === 'bon') {
    h += `<div style="font-size:11px;color:#8a6a30;margin-bottom:6px">解放 ${bonCount()} / 7　（演出で登場・図柄で大当たり・応援ガチャで会えると解放）</div><div class="grid7">`;
    for (let i = 0; i < 7; i++) {
      const open = bonOpen(i), c = G.gacha.cards[i] || 0;
      h += `<div class="gc ${open ? '' : 'lock'}"><div class="art"><img src="${bonArt(i)}" alt="" class="${open ? '' : 'sil'}"></div><b>${open ? SYMBOL_NAMES[i] : '？？？'}</b>${open ? `応援カード ${c}枚<br>当てた回数 ${G.dex.sym[7 + i] || 0}` : 'ひみつ'}</div>`;
    }
    h += '</div>';
  } else if (dexTab === 'sym') {
    const seen = Object.keys(G.dex.symSeen).length, hit = Object.values(G.dex.sym).filter(v => v > 0).length;
    h += `<div style="font-size:11px;color:#8a6a30;margin-bottom:6px">見た ${seen} / ${SYM_DEFS.length}　当てた ${hit} / ${SYM_DEFS.length}</div><div class="grid7" style="grid-template-columns:repeat(4,1fr)">`;
    SYM_DEFS.forEach((d, i) => {
      const hitN = G.dex.sym[i] || 0, sn = G.dex.symSeen[i];
      let ico = d.kind === 'bon' ? `<img src="${BON_IMG[SYMBOLS[d.bon]]}" alt="">` : d.kind === 'star' ? '★' : d.kind === 'fever' ? '🔥' : esc(d.label);
      const col = d.kind === 'num' ? NUMCOL[+d.label - 1] : '#d99a00';
      h += `<div class="gc ${hitN ? '' : 'lock'}"><div class="sy" style="color:${hitN ? col : '#bbb'};${sn || hitN ? '' : 'filter:brightness(0) opacity(.25)'}">${ico}</div><b>${sn || hitN ? esc(d.label) : '？'}</b>${hitN ? `当たり ${hitN}回` : sn ? '見た' : '未'}</div>`;
    });
    h += '</div>';
  } else if (dexTab === 'fx') {
    h += `<div style="font-size:11px;color:#8a6a30;margin-bottom:4px">解放 ${dexCount()} / ${DEX_TOTAL()}　（見た回数つき）</div>`;
    const sec = (title, obj, kind, nameOf) => {
      h += `<div class="sec">${title}</div>`;
      for (const k of Object.keys(obj)) { const n = G.dex[kind][k] || 0; h += `<div class="row"><div>${n ? esc(nameOf(obj[k])) : '？？？？？'}${n && obj[k].tier !== undefined ? `<small>${TIER[obj[k].tier]}</small>` : ''}</div><div>${n ? n + '回' : '未'}</div></div>`; }
    };
    sec('予告演出', YOKOKU, 'yk', o => o.name); sec('リーチ演出', REACHES, 'rc', o => o.name); sec('大当たり・状態', SP_DEX, 'sp', o => o);
  } else {
    const r = G.rec, rows = [
      ['遊技回数', state.plays], ['打った玉', state.shot], ['入賞', state.hit], ['通常回転', state.spins], ['大当たり', state.wins], ['最高持ち玉', state.maxHave],
      ['最大連チャン', r.bestChain], ['確変突入', r.kaku], ['時短突入', r.jitan], ['7揃い', r.seven], ['プレミアム', r.premium], ['電チュー入賞', r.den],
      ['応援ガチャ', r.gacha], ['クイズ正解', `${r.quizOk} / ${r.quizAll}`], ['ログイン日数', G.login.total], ['連続ログイン', G.login.streak + '日'],
    ];
    h += rows.map(([a, b]) => `<div class="row"><div>${a}</div><div>${b}</div></div>`).join('');
  }
  openSub(h + closeBtn);
  document.querySelectorAll('#subBox [data-t]').forEach(b => b.onclick = () => openDex(b.dataset.t));
}

loadGame(); const __lr = loginCheck(); renderMenu(); if (__lr) showLogin(__lr);

/* ---------- メインループ ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 1 / 20) dt = 1 / 20;
  if (playing && (firing || autoFire)) {
    fireTimer += dt;
    while (fireTimer >= RATES[save.rate].interval) { fireTimer -= RATES[save.rate].interval; if (!fireBall()) { fireTimer = 0; break; } }
  } else fireTimer = RATES[save.rate].interval; // 押した瞬間に1発目
  const h = 1 / 60 / CONFIG.subSteps;
  acc += dt;
  let n = 0;
  while (acc >= h && n < CONFIG.subSteps * 3) { step(h); acc -= h; n++; }
  if (acc > h * 4) acc = 0;
  postStep(dt);
  if (playing) updateLCD(dt);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.5);
  updateUI(); updateHud(); draw();
  requestAnimationFrame(frame);
}

resize(); updateDial(); updateUI();
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
